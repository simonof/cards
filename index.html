<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Вопросы админам — флеш-карточки</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Вопросы админам</h1>
    <div class="progress">
      <span id="counter">– / –</span>
      <div class="bar"><div id="barfill"></div></div>
    </div>
    <label class="topic">
      <span>Тема</span>
      <select id="topic"></select>
    </label>
  </header>

  <main class="stage">
    <div id="scene" class="scene">
      <div id="flipper" class="flipper" role="button" tabindex="0" aria-label="Перевернуть карточку">
        <!-- Front: question -->
        <div class="face front">
          <div class="labels"><span class="tag">Вопрос</span><span id="cat-front" class="tag tag-cat"></span></div>
          <p id="q" class="qtext"></p>
          <div class="hint">нажми, чтобы перевернуть</div>
        </div>
        <!-- Back: answer -->
        <div class="face back">
          <div class="labels"><span class="tag tag-answer">Ответ</span><span id="cat-back" class="tag tag-cat"></span></div>
          <div id="a" class="atext">
            <div id="answer-img" class="imgbox" hidden></div>
            <div id="answer-body" class="atext-body"></div>
            <div id="answer-links" class="links"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <nav class="controls">
    <button id="prev" class="btn" aria-label="Предыдущая">‹</button>
    <button id="shuffle" class="btn btn-primary">Перемешать</button>
    <button id="next" class="btn" aria-label="Следующая">›</button>
  </nav>

  <footer class="status" id="status"></footer>

  <script src="app.js" defer></script>
</body>
</html>
