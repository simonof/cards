<rect width="720" height="420" fill="#ffffff"/><text x="40" y="45" font-size="20" font-weight="800" fill="#1f2937">NAT (Network Address Translation)</text><rect x="40" y="130" width="180" height="80" rx="10" fill="#f3f4f6" stroke="#7c3aed" stroke-width="2"/><text x="130.0" y="165.05" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Приватная сеть</text><text x="130.0" y="187.55" text-anchor="middle" font-size="16" fill="#1f2937">192.168.1.0/24</text><rect x="270" y="130" width="170" height="80" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><text x="355.0" y="165.05" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Роутер / NAT</text><text x="355.0" y="187.55" text-anchor="middle" font-size="16" fill="#1f2937">шлюз</text><rect x="500" y="130" width="170" height="80" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/><text x="585.0" y="165.05" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Интернет</text><text x="585.0" y="187.55" text-anchor="middle" font-size="16" fill="#1f2937">публичный IP</text><line x1="225" y1="170" x2="265" y2="170" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><line x1="445" y1="170" x2="495" y2="170" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/><text x="245" y="160" font-size="13" fill="#6b7280" text-anchor="middle">1</text><text x="470" y="160" font-size="13" fill="#6b7280" text-anchor="middle">2</text><text x="360" y="265" font-size="15" fill="#1f2937" text-anchor="middle">10.0.0.5:5000  →  85.12.34.56:34567</text><text x="360" y="300" font-size="14" fill="#6b7280" text-anchor="middle">Внутренний адрес заменяется на публичный;</text><text x="360" y="325" font-size="14" fill="#6b7280" text-anchor="middle">обратный ответ приходит на тот же порт</text></svg>
