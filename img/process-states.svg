<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="Arial">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2937"/></marker></defs>
<rect width="720" height="420" fill="#ffffff"/><text x="40" y="45" font-size="20" font-weight="800" fill="#1f2937">Жизненный цикл процесса</text><rect x="40" y="90" width="220" height="60" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="150.0" y="125.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">RUNNING / READY</text><rect x="40" y="160" width="220" height="60" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><text x="150.0" y="195.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">SLEEPING</text><rect x="40" y="230" width="220" height="60" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/><text x="150.0" y="265.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">ZOMBIE</text><rect x="40" y="300" width="220" height="60" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="150.0" y="335.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">STOPPED</text><text x="290" y="155" font-size="15" fill="#1f2937">Zombie — процесс завершил работу,</text><text x="290" y="180" font-size="15" fill="#1f2937">но родитель ещё не вызвал wait()</text><text x="290" y="230" font-size="15" fill="#6b7280">SIGKILL не поможет — он уже мёртв.</text><text x="290" y="255" font-size="15" fill="#6b7280">Помогает только wait() родителя.</text></svg>
