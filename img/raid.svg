<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="Arial">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2937"/></marker></defs>
<rect width="720" height="420" fill="#ffffff"/><text x="40" y="45" font-size="20" font-weight="800" fill="#1f2937">Уровни RAID</text><rect x="40" y="80" width="150" height="70" rx="10" fill="#f3f4f6" stroke="#7c3aed" stroke-width="2"/><text x="115.0" y="110.05" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">RAID 0</text><text x="115.0" y="132.55" text-anchor="middle" font-size="16" fill="#1f2937">скорость</text><rect x="210" y="80" width="150" height="70" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><text x="285.0" y="110.05" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">RAID 1</text><text x="285.0" y="132.55" text-anchor="middle" font-size="16" fill="#1f2937">зеркало</text><rect x="380" y="80" width="150" height="70" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/><text x="455.0" y="110.05" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">RAID 5</text><text x="455.0" y="132.55" text-anchor="middle" font-size="16" fill="#1f2937">четность</text><rect x="550" y="80" width="130" height="70" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/><text x="615.0" y="110.05" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">RAID 10</text><text x="615.0" y="132.55" text-anchor="middle" font-size="16" fill="#1f2937">зеркало+полоса</text><text x="40" y="200" font-size="15" fill="#1f2937">Минимум дисков:</text><text x="40" y="230" font-size="15" fill="#1f2937">RAID 0 — 2,  RAID 1 — 2,  RAID 5 — 3,  RAID 10 — 4</text><text x="40" y="270" font-size="15" fill="#6b7280">RAID 0 — нет отказоустойчивости (данные теряются при отказе диска)</text><text x="40" y="300" font-size="15" fill="#6b7280">RAID 1 — надёжность, но вдвое меньше полезного объёма</text><text x="40" y="330" font-size="15" fill="#6b7280">RAID 5 — баланс скорости и надёжности</text></svg>
