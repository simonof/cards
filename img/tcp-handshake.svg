<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="Arial">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2937"/></marker></defs>
<rect width="720" height="420" fill="#ffffff"/><text x="40" y="45" font-size="20" font-weight="800" fill="#1f2937">TCP 3-way handshake</text><rect x="60" y="90" width="120" height="55" rx="10" fill="#f3f4f6" stroke="#7c3aed" stroke-width="2"/><text x="120.0" y="112.55" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Клиент</text><text x="120.0" y="135.05" text-anchor="middle" font-size="16" fill="#1f2937">SYN_SENT</text><rect x="60" y="310" width="120" height="55" rx="10" fill="#f3f4f6" stroke="#7c3aed" stroke-width="2"/><text x="120.0" y="332.55" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Сервер</text><text x="120.0" y="355.05" text-anchor="middle" font-size="16" fill="#1f2937">LISTEN</text><line x1="185" y1="118" x2="490" y2="145" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ah)"/><text x="337.5" y="125.5" font-size="13" fill="#3b82f6" text-anchor="middle" font-family="Arial">SYN (seq=x)</text><line x1="490" y1="190" x2="185" y2="163" stroke="#10b981" stroke-width="2.5" marker-end="url(#ah)"/><text x="337.5" y="170.5" font-size="13" fill="#10b981" text-anchor="middle" font-family="Arial">SYN+ACK (seq=y, ack=x+1)</text><line x1="185" y1="208" x2="490" y2="235" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ah)"/><text x="337.5" y="215.5" font-size="13" fill="#f59e0b" text-anchor="middle" font-family="Arial">ACK (ack=y+1)</text><text x="340" y="285" font-size="14" fill="#6b7280" text-anchor="middle">Соединение установлено (ESTABLISHED)</text></svg>
